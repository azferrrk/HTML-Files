<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }

      header {
        background-color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      nav a {
        text-decoration: none;
        color: black;
        font-size: medium;
      }

      .nav-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        background-color: white;
        border-radius: 20px;
        padding: 20px;
        font-size: medium;
        border: solid;
        border-color: whitesmoke;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .btn {
        padding: 10px;
      }

      main {
        min-height: 600px;
        background: url(Multimedia/hunters-race-MYbhN8KaaEc-unsplash.jpg);
        border-radius: 20px;
        margin-left: 20px;
        margin-right: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      h1 {
        padding: 5px;
        font-family: fantasy;
        font-size: 72px;
        color: white;
        margin-left: 5px;
      }

      p {
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        padding: 5px;
        color: white;
        margin-left: 5px;
      }

      .btn3 {
        padding: 10px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <img
            src="Multimedia/images.jpg"
            alt=""
            width="100px"
            height="100px"
            alt="logo"
          />
        </div>

        <a href="">About</a>
        <a href="">Service</a>
        <a href="">Case Studies</a>
        <a href="">Articles</a>

        <div class="nav-buttons">
          <button class="btn 1">Contact Us</button>
          <button>📞</button>
        </div>
      </nav>
    </header>
    <main>
      <section>
        <h1>Strategic Clarity <br> Sustainable Growth.</h1>
        <p>We help businesses refine strategy, strengthen operations, scale with <br> confidence through date-driven consulting and practical execution.</p>
        <button class="btn3">Book a Call -></button>
      </section>
    </main>
  </body>
</html>
