<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind css Single Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white rounded-lg shadow-lg p-6 max-w-sm w-full">
      <img src="https://via.placeholder.com/150" alt="Card Image" class="rounded-t-lg mb-4">
      <h2 class="text-xl font-semibold mb-2">Card Title</h2>
      <p class="text-gray-700 mb-4">This is a simple card component built with Tailwind CSS. It can be used to display content in a visually appealing way.</p>
      <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Learn More</button>
    </div>
  </div>
</body>
</html>
