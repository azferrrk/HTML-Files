<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="/submit" method="post">
    <fieldset>
      <legend>Form</legend>
            <input type="text" id="name" required>
      <label for="name">Name</label>
      <br>
      <input type="radio" id="gender" value="male">
      <label for="male">Email</label>
      <br>
      <input type="radio" id="phone">
      <label for="phone">Phone</label>
      <br>
      <br>
      <p>Phone</p>
      <input type="checkbox" id="mobile">
      <label for="mobile">Samsung</label>

<br>
<br>

      <select>
        <optgroup label="fruits">
          <option>Watermelon</option>
          <option selected>Mango</option>
          <option>Kiwi</option>
        </optgroup>

        <optgroup label="vegetables" disabled>
          <option>Tomato</option>
          <option>Potato</option>
          <option>Brinjal</option>
        </optgroup>
      </select>
    </fieldset>

</body>
</html>
